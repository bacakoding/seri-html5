<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Galeri Kopi Senja</title>
  </head>
  <body>
    <h1>Suasana Kedai Kopi Senja</h1>

    <figure>
      <video controls width="320" preload="metadata">
        <source src="kopi-senja.webm" type="video/webm">
        <source src="kopi-senja.mp4" type="video/mp4">
        Browser kamu tidak mendukung video HTML5. <a href="kopi-senja.mp4">Unduh videonya di sini.</a>
      </video>
      <figcaption>Cuplikan suasana sore di kedai.</figcaption>
    </figure>

    <p>Dengarkan musik latar kami:</p>
    <audio controls preload="none">
      <source src="musik-senja.ogg" type="audio/ogg">
      <source src="musik-senja.mp3" type="audio/mpeg">
      Browser kamu tidak mendukung audio HTML5. <a href="musik-senja.mp3">Unduh musiknya di sini.</a>
    </audio>
  </body>
</html>
