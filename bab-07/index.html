<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Jadwal Buka - Kedai Kopi Senja</title>
  </head>
  <body>
    <h1>Jadwal Buka</h1>
    <table>
      <caption>Jam buka Kedai Kopi Senja</caption>
      <thead>
        <tr>
          <th scope="col">Hari</th>
          <th scope="col">Buka</th>
          <th scope="col">Tutup</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Senin sampai Sabtu</th>
          <td>15.00</td>
          <td>22.00</td>
        </tr>
        <tr>
          <th scope="row">Minggu</th>
          <td colspan="2">Libur</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
