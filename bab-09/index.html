<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Pesan Tempat (dengan validasi) - Kedai Kopi Senja</title>
  </head>
  <body>
    <h1>Pesan Tempat</h1>
    <form action="terima.html" method="get">
      <p>
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" name="nama" required minlength="3">
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="telepon">Nomor telepon</label>
        <input type="tel" id="telepon" name="telepon" pattern="[0-9]{10,13}" title="Isi 10 sampai 13 angka, tanpa spasi atau tanda hubung" required>
      </p>
      <p>
        <label for="jumlah">Jumlah tamu (1 sampai 8)</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="8" required>
      </p>
      <p>
        <label for="tanggal">Tanggal kunjungan</label>
        <input type="date" id="tanggal" name="tanggal" min="2026-10-14" required>
      </p>
      <p>
        <input type="checkbox" id="setuju" name="setuju" value="ya" required>
        <label for="setuju">Saya setuju dihubungi untuk konfirmasi</label>
      </p>
      <button type="submit">Kirim pesanan</button>
    </form>
  </body>
</html>
